name: CI/CD Pipeline

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"
  APP_DOMAIN: internationalboard.uk

jobs:
  # ─────────────────────────────────────────────────────────────
  # Build release artifact
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Artifact
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: >
            mbstring,
            openssl,
            pdo_mysql,
            fileinfo,
            sodium,
            curl,
            tokenizer,
            xml,
            ctype,
            json,
            bcmath

      - name: ♻️ Validate Composer files
        run: composer validate --strict

      - name: 📋 Prepare CI environment
        run: |
          cp .env.example .env
          echo "APP_ENV=production" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env

      - name: 📦 Install dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: 🧪 Verify Laravel bootstrap
        run: php artisan about

      - name: 🗜️ Create release archive
        run: |
          rm -rf build release.tar.gz
          mkdir -p build/release

          rsync -a ./ build/release/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/app/*'

          tar -czf release.tar.gz -C build/release .

      - name: ⬆️ Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Deploy
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Hostinger
    needs: build
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/production'

    steps:
      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: .

      - name: 📤 Upload release to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: /tmp
          overwrite: true

      - name: 🚀 Atomic deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -Eeuo pipefail

            APP_DOMAIN="${{ env.APP_DOMAIN }}"
            BASE_PATH="/home/${{ secrets.HOSTINGER_SSH_USERNAME }}/domains/${APP_DOMAIN}/public_html/production"

            RELEASES_PATH="${BASE_PATH}/releases"
            SHARED_PATH="${BASE_PATH}/shared"
            CURRENT_PATH="${BASE_PATH}/current"

            RELEASE_ID="$(date +%Y%m%d%H%M%S)"
            RELEASE_PATH="${RELEASES_PATH}/${RELEASE_ID}"

            PHP_BIN="$(command -v php8.5 || command -v php || echo /usr/bin/php)"

            echo "========================================="
            echo "🚀 Starting atomic deployment"
            echo "📦 Release: ${RELEASE_ID}"
            echo "🐘 PHP: $($PHP_BIN -r 'echo PHP_VERSION;')"
            echo "========================================="

            # ─────────────────────────────────────────
            # Create required directories
            # ─────────────────────────────────────────
            mkdir -p "${RELEASES_PATH}"
            mkdir -p "${SHARED_PATH}/storage/app"
            mkdir -p "${SHARED_PATH}/storage/logs"
            mkdir -p "${SHARED_PATH}/storage/framework/cache"
            mkdir -p "${SHARED_PATH}/storage/framework/sessions"
            mkdir -p "${SHARED_PATH}/storage/framework/views"

            # ─────────────────────────────────────────
            # Validate shared .env
            # ─────────────────────────────────────────
            if [ ! -f "${SHARED_PATH}/.env" ]; then
              echo "❌ Missing shared .env file"
              echo "Create:"
              echo "${SHARED_PATH}/.env"
              exit 1
            fi

            # ─────────────────────────────────────────
            # Create release directory
            # ─────────────────────────────────────────
            mkdir -p "${RELEASE_PATH}"

            # ─────────────────────────────────────────
            # Extract release
            # ─────────────────────────────────────────
            tar -xzf /tmp/release.tar.gz -C "${RELEASE_PATH}" \
              || {
                echo "❌ Failed extracting release"
                exit 1
              }

            rm -f /tmp/release.tar.gz

            cd "${RELEASE_PATH}"

            # ─────────────────────────────────────────
            # Link shared resources
            # ─────────────────────────────────────────
            rm -rf storage

            ln -s "${SHARED_PATH}/storage" storage
            ln -s "${SHARED_PATH}/.env" .env

            # ─────────────────────────────────────────
            # Permissions
            # ─────────────────────────────────────────
            chmod -R ug+rwx storage bootstrap/cache || true

            # ─────────────────────────────────────────
            # Verify Laravel boot
            # ─────────────────────────────────────────
            echo "🧪 Verifying Laravel bootstrap..."

            $PHP_BIN artisan about || {
              echo "❌ Laravel failed to boot"
              exit 1
            }

            # ─────────────────────────────────────────
            # Clear stale caches
            # ─────────────────────────────────────────
            $PHP_BIN artisan optimize:clear

            # ─────────────────────────────────────────
            # Build production caches
            # ─────────────────────────────────────────
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache
            $PHP_BIN artisan event:cache || true

            # ─────────────────────────────────────────
            # Atomic symlink switch
            # ─────────────────────────────────────────
            ln -sfn "${RELEASE_PATH}" "${CURRENT_PATH}"

            # ─────────────────────────────────────────
            # Cleanup old releases
            # Keep latest 5
            # ─────────────────────────────────────────
            cd "${RELEASES_PATH}"

            ls -1dt */ | tail -n +6 | xargs -r rm -rf

            echo "========================================="
            echo "✅ Deployment completed"
            echo "🌐 https://${APP_DOMAIN}"
            echo "📂 Current: ${CURRENT_PATH}"
            echo "========================================="

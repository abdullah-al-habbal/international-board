name: CI/CD Pipeline

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"
  APP_DOMAIN: internationalboard.uk

jobs:
  # ─────────────────────────────────────────────────────────────
  # Build release artifact
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Artifact
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: >
            mbstring,
            openssl,
            pdo_mysql,
            fileinfo,
            sodium,
            curl,
            tokenizer,
            xml,
            ctype,
            json,
            bcmath

      - name: ♻️ Validate Composer files
        run: composer validate --strict

      - name: 📋 Prepare CI environment
        run: |
          cp .env.example .env
          echo "APP_ENV=production" >> .env
          echo "APP_DEBUG=false" >> .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env

      - name: 📦 Install dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --optimize-autoloader

      - name: 🧪 Verify Laravel bootstrap
        run: php artisan about

      - name: 🗜️ Create release archive
        run: |
          rm -rf build release.tar.gz
          mkdir -p build/release

          rsync -a ./ build/release/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/app/*'

          tar -czf release.tar.gz -C build/release .

      - name: ⬆️ Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Deploy to Hostinger via FTP (files) + SSH (commands)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Hostinger (FTP + SSH)
    needs: build
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/production'

    steps:
      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: .

      - name: 📦 Extract tarball
        run: |
          mkdir release_content
          tar -xzf release.tar.gz -C release_content

      - name: 📤 Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.0.0
        with:
          server: ${{ secrets.FTP_HOST }}
          port: ${{ secrets.FTP_PORT }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./release_content/
          server-dir: domains/internationalboard.uk/public_html/production/
          dangerous-clean-slate: true
          exclude: |
            .env
            storage/

      - name: 🚀 Run remote commands (migrations, cache)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -Eeuo pipefail

            TARGET="/home/${{ secrets.HOSTINGER_SSH_USERNAME }}/domains/internationalboard.uk/public_html/production"
            PHP_BIN="$(command -v php8.5 || command -v php || echo /usr/bin/php)"

            echo "========================================="
            echo "🚀 Running post-deploy commands"
            echo "📂 Target: ${TARGET}"
            echo "🐘 PHP: $($PHP_BIN -r 'echo PHP_VERSION;')"
            echo "========================================="

            cd "$TARGET"

            # ─────────────────────────────────────────
            # Ensure runtime directories
            # ─────────────────────────────────────────
            mkdir -p storage/framework/{cache,sessions,views}
            mkdir -p storage/logs
            mkdir -p bootstrap/cache

            # ─────────────────────────────────────────
            # Enforce .env exists
            # ─────────────────────────────────────────
            if [ ! -f .env ]; then
              echo "❌ Missing .env in ${TARGET}"
              exit 1
            fi

            # ─────────────────────────────────────────
            # Permissions
            # ─────────────────────────────────────────
            chmod -R ug+rwx storage bootstrap/cache || true

            # ─────────────────────────────────────────
            # Run database migrations
            # ─────────────────────────────────────────
            echo "🧬 Running database migrations..."
            $PHP_BIN artisan migrate --force
            echo "✅ Migrations complete"

            # ─────────────────────────────────────────
            # Verify Laravel boot
            # ─────────────────────────────────────────
            echo "🧪 Verifying Laravel bootstrap..."

            $PHP_BIN artisan about || {
              echo "❌ Laravel failed to boot"
              exit 1
            }

            # ─────────────────────────────────────────
            # Build production caches
            # ─────────────────────────────────────────
            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan config:cache
            $PHP_BIN artisan route:cache
            $PHP_BIN artisan view:cache

            echo "========================================="
            echo "✅ Deployment completed"
            echo "🌐 https://internationalboard.uk"
            echo "========================================="

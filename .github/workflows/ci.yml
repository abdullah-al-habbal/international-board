name: CI/CD Pipeline

on:
  push:
    branches:
      - production

jobs:
  deploy:
    name: Deploy to Hostinger (Production Only)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            echo "🔗 Connecting to Hostinger..."
            DEPLOY_PATH="/home/u685718414/domains/internationalboard.uk/public_html/production"
            BRANCH="production"

            echo "📂 Deploy path: $DEPLOY_PATH"
            echo "🌿 Branch: $BRANCH"

            cd "$DEPLOY_PATH" || { echo "❌ ERROR: Cannot cd into $DEPLOY_PATH"; exit 1; }

            echo "🔄 Pulling latest code..."
            git fetch origin || { echo "❌ ERROR: git fetch failed"; exit 1; }
            git checkout $BRANCH || { echo "❌ ERROR: git checkout failed"; exit 1; }
            git reset --hard origin/$BRANCH || { echo "❌ ERROR: git reset failed"; exit 1; }

            echo "📦 Installing optimized dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction || { echo "❌ ERROR: composer install failed"; exit 1; }

            echo "🧹 Clearing old caches..."
            php artisan config:clear || echo "⚠️ Warning: config:clear failed"
            php artisan route:clear || echo "⚠️ Warning: route:clear failed"
            php artisan view:clear || echo "⚠️ Warning: view:clear failed"

            echo "🧽 Running Pint auto-fix..."
            ./vendor/bin/pint || echo "⚠️ Warning: Pint failed"

            echo "⚡ Rebuilding caches..."
            php artisan config:cache || echo "⚠️ Warning: config:cache failed"
            php artisan route:cache || echo "⚠️ Warning: route:cache failed"
            php artisan view:cache || echo "⚠️ Warning: view:cache failed"
            php artisan optimize || echo "⚠️ Warning: optimize failed"

            echo "✅ Deployment complete!"

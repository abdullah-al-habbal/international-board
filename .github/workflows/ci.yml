name: CI/CD Pipeline

on:
  push:
    branches:
      - production

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"
  APP_DOMAIN: internationalboard.uk

jobs:
  build:
    name: 🏗️ Build Artifact
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: mbstring, openssl, pdo_mysql, fileinfo, sodium, curl, tokenizer, xml, ctype, json, bcmath

      - name: 📦 Validate Composer
        run: composer validate --strict

      - name: 📦 Install dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --optimize-autoloader

      - name: 🧪 Laravel sanity check
        run: php artisan about

      - name: 🗜️ Create release package
        run: |
          rm -rf build release.tar.gz
          mkdir -p build/release

          rsync -a ./ build/release/ \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='storage/logs/*' \
            --exclude='storage/framework/*'

          tar -czf release.tar.gz -C build/release .

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 1

  deploy:
    name: 🚀 Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: build

    if: github.ref == 'refs/heads/production'

    steps:
      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: .

      - name: 🔍 Validate SSH connectivity
        run: |
          timeout 10s nc -zv ${{ secrets.HOSTINGER_SERVER_IP }} 65002 || exit 1

      - name: 📤 Upload release via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          port: 65002
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: /tmp
          overwrite: true

      - name: 🚀 Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          port: 65002
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -Eeuo pipefail

            TARGET="/home/${{ secrets.HOSTINGER_SSH_USERNAME }}/domains/internationalboard.uk/public_html/production"

            echo "Deploying to: $TARGET"

            # Ensure target directory exists
            mkdir -p "$TARGET"

            cd "$TARGET"

            echo "Extracting release..."
            tar -xzf /tmp/release.tar.gz -C "$TARGET"
            rm -f /tmp/release.tar.gz

            echo "Running migrations..."
            php artisan migrate --force

            echo "Clearing and caching..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Verifying application..."
            php artisan about

            echo "Deployment completed successfully"
name: CI/CD Pipeline

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build artifact on the runner (no SSH needed)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build Artifact
    runs-on: ubuntu-latest
    outputs:
      artifact-name: release.tar.gz

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, openssl, pdo_mysql, fileinfo, sodium, curl

      - name: 📋 Create CI environment file
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> .env

      - name: 📦 Install Composer dependencies (production, no-dev)
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-dev

      - name: 🎁 Prepare release artifact
        run: |
          rm -rf artifact release.tar.gz || true
          mkdir -p artifact
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='storage/logs' \
            --exclude='storage/framework' \
            --exclude='storage/app' \
            ./ artifact/
          rsync -a vendor/ artifact/vendor/
          tar -czf release.tar.gz -C artifact .

      - name: ⬆️ Upload artifact to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Deploy — SCP upload then SSH exec (mirrors the_pilates_studio_sy)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Hostinger (Production Only)
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'

    steps:
      - name: 🔍 Debug SSH connectivity
        run: |
          echo "=== Network Debug ==="
          echo "Runner IP: $(curl -sS https://api.ipify.org)"
          echo "Target: ${{ secrets.HOSTINGER_SERVER_IP }}:${{ secrets.HOSTINGER_SSH_PORT }}"
          sudo apt-get install -y netcat-openbsd -q
          nc -zv -w5 ${{ secrets.HOSTINGER_SERVER_IP }} ${{ secrets.HOSTINGER_SSH_PORT }} \
            && echo "✅ Port reachable" \
            || echo "❌ Port NOT reachable — whitelist runner IP in Hostinger firewall"

      - name: ⬇️ Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: .

      - name: 📤 SCP artifact to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: /home/${{ secrets.HOSTINGER_SSH_USERNAME }}/domains/internationalboard.uk/public_html/production
          timeout: 30s
          command_timeout: 10m

      - name: 🔧 Remote deploy via SSH
        uses: appleboy/ssh-action@v1.0.3       # ← matches pilates; v0.1.8 lacks fingerprint options
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="/home/${{ secrets.HOSTINGER_SSH_USERNAME }}/domains/internationalboard.uk/public_html/production"
            PHP_BIN="$(command -v php8.3 || command -v php8.2 || command -v php || echo /usr/bin/php)"

            echo "========================================="
            echo "🚀 Deploying to Hostinger"
            echo "📂 Path: $DEPLOY_PATH"
            echo "🐘 PHP: $($PHP_BIN -r 'echo PHP_VERSION;')"
            echo "========================================="

            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            # Guard: .env must exist before any artisan command
            if [ ! -f .env ]; then
              echo "❌ FATAL: .env missing at $DEPLOY_PATH"
              echo "   Place the .env file on the server before deploying."
              exit 1
            fi

            # Ensure storage scaffold
            mkdir -p storage/logs
            mkdir -p storage/framework/{cache,sessions,views}
            mkdir -p storage/app/public

            # Backup user-uploaded files before extraction
            if [ -d storage/app ]; then
              mv storage/app "storage/app.bak.$(date +%s)"
            fi

            # Extract artifact (release.tar.gz was SCP'd to this directory)
            tar -xzf release.tar.gz -C .
            rm -f release.tar.gz

            # Restore uploads
            for d in storage/app.bak.*; do
              [ -d "$d" ] && rsync -a "$d"/ storage/app/ && rm -rf "$d" || true
            done

            # Permissions
            chmod -R 775 storage bootstrap/cache || true

            # Clear stale caches
            $PHP_BIN artisan config:clear   || echo "⚠️ config:clear failed"
            $PHP_BIN artisan route:clear    || echo "⚠️ route:clear failed"
            $PHP_BIN artisan view:clear     || echo "⚠️ view:clear failed"
            $PHP_BIN artisan cache:clear    || echo "⚠️ cache:clear failed"

            # Composer install (in case vendor is missing on fresh deploy)
            if [ ! -d vendor ]; then
              echo "⚠️ vendor/ missing — running composer install on server"
              COMPOSER="$(command -v composer2.phar || command -v composer || echo /usr/local/bin/composer2.phar)"
              php -d disable_functions='' "$COMPOSER" install \
                --no-dev --optimize-autoloader --no-interaction \
                || { echo "❌ composer install failed"; exit 1; }
            fi

            # APP_KEY guard
            KEY=$(grep -E '^APP_KEY=' .env | cut -d= -f2-)
            if [ -z "$KEY" ] || [ "$KEY" = "base64:" ]; then
              $PHP_BIN artisan key:generate --force || echo "⚠️ key:generate failed"
            else
              echo "🔑 APP_KEY already set; skipping key:generate"
            fi

            # Note: skipping migrations — DB managed manually
            echo "⏭️ Skipping migrations (managed manually)."

            # Rebuild caches
            $PHP_BIN artisan config:cache   || echo "⚠️ config:cache failed"
            $PHP_BIN artisan route:cache    || echo "⚠️ route:cache failed"
            $PHP_BIN artisan view:cache     || echo "⚠️ view:cache failed"
            $PHP_BIN artisan optimize       || echo "⚠️ optimize failed"

            # DB connectivity check
            $PHP_BIN artisan db:show --no-interaction 2>&1 | grep -E '(database|status|driver)' \
              || echo "⚠️ db:show unavailable (Laravel < 10)"

            echo "✅ Deployment finished successfully!"
            echo "🌐 https://internationalboard.uk"
            echo "========================================="

      - name: ✅ Notify success
        if: success()
        run: |
          echo "✅ Deployment completed: $(date)"
          echo "🌐 https://internationalboard.uk"

      - name: 🚨 Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed: $(date)"
          echo "Runner IP was: $(curl -sS https://api.ipify.org)"
          echo "Whitelist the above IP in Hostinger hPanel → Security → Firewall"
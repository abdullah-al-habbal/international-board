name: CI/CD Pipeline

on:
  push:
    branches:
      - production
  workflow_dispatch: # Allows manual triggering from GitHub Actions tab

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.5"
  APP_DOMAIN: internationalboard.uk

jobs:
  deploy:
    name: 🚀 Deploy to Hostinger via Git
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/production'

    steps:
      - name: 🚀 Deploy via SSH (Git Pull)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          port: 65002
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -Eeuo pipefail

            TARGET="/home/${{ secrets.HOSTINGER_SSH_USERNAME }}/domains/internationalboard.uk/public_html/production"
            DEPLOY_KEY="/home/${{ secrets.HOSTINGER_SSH_USERNAME }}/.ssh/deploy_key"
            
            # Tell Git to use the deploy key we created earlier
            export GIT_SSH_COMMAND="ssh -i $DEPLOY_KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=no"

            echo "🎯 Deploying to: $TARGET"
            cd "$TARGET"

            echo "📥 Fetching latest changes from Git..."
            git fetch origin production
            git reset --hard origin/production
            
            # Clean any untracked files that might have been left behind (respects .gitignore)
            git clean -fd

            echo "📦 Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗄️ Running migrations..."
            php artisan migrate --force

            echo "🧹 Clearing and caching..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "✅ Verifying application..."
            php artisan about

            echo "🎉 Deployment completed successfully"